<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 188" role="img" aria-label="Virtual address 15KB passes the bounds check (16KB), then the base 32KB is added to give physical address 47KB; a virtual address over 16KB raises an error">
<defs><marker id="arr-base-bounds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<rect x="170" y="40" width="300" height="90" class="bx" rx="6" stroke-dasharray="5 4"/><text x="180" y="33" class="mu" font-size="12" text-anchor="start" font-weight="600">Memory management unit (MMU), on the CPU</text><rect x="10" y="62" width="130" height="48" class="ja" rx="5"/><text x="75" y="82" class="on" font-size="12" text-anchor="middle" font-weight="600">Virtual address</text><text x="75" y="99" class="on" font-size="11" text-anchor="middle">15KB</text><rect x="185" y="62" width="125" height="48" class="jc" rx="5"/><text x="247.5" y="82" class="on" font-size="12" text-anchor="middle" font-weight="600">Bounds register</text><text x="247.5" y="99" class="on" font-size="11" text-anchor="middle">16KB</text><rect x="330" y="62" width="125" height="48" class="jd" rx="5"/><text x="392.5" y="82" class="on" font-size="12" text-anchor="middle" font-weight="600">Base register</text><text x="392.5" y="99" class="on" font-size="11" text-anchor="middle">32KB</text><rect x="500" y="62" width="130" height="48" class="jb" rx="5"/><text x="565" y="82" class="on" font-size="12" text-anchor="middle" font-weight="600">Physical address</text><text x="565" y="99" class="on" font-size="11" text-anchor="middle">32 + 15 = 47KB</text><line x1="140" y1="86" x2="181" y2="86" class="st" stroke-width="1.4" marker-end="url(#arr-base-bounds)"/><line x1="310" y1="86" x2="326" y2="86" class="st" stroke-width="1.4" marker-end="url(#arr-base-bounds)"/><line x1="455" y1="86" x2="496" y2="86" class="st" stroke-width="1.4" marker-end="url(#arr-base-bounds)"/><line x1="247" y1="110" x2="247" y2="158" class="st" stroke-width="1.4" marker-end="url(#arr-base-bounds)"/><text x="247" y="176" class="fg" font-size="12" text-anchor="middle" font-weight="600">VA more than 16KB → error</text>
</svg>
