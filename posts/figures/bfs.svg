<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" role="img" aria-label="BFS: one global queue ordered by virtual deadline; each CPU takes the task with the earliest deadline">
<defs><marker id="arr-bfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<text x="20" y="24" class="mu" font-size="12" text-anchor="start" font-weight="600">One global queue, ordered by virtual deadline</text><text x="20" y="74" class="fg" font-size="13" text-anchor="start" font-weight="600">Queue</text><line x1="76" y1="70" x2="100" y2="70" class="st" stroke-width="1.4" marker-end="url(#arr-bfs)"/><circle cx="130" cy="70" r="15" class="ja"/><text x="130" y="75" class="on" font-size="13" text-anchor="middle" font-weight="600">A</text><text x="130" y="104" class="mu" font-size="11" text-anchor="middle">deadline 12</text><line x1="145" y1="70" x2="204" y2="70" class="st" stroke-width="1.4" marker-end="url(#arr-bfs)"/><circle cx="220" cy="70" r="15" class="jc"/><text x="220" y="75" class="on" font-size="13" text-anchor="middle" font-weight="600">C</text><text x="220" y="104" class="mu" font-size="11" text-anchor="middle">deadline 15</text><line x1="235" y1="70" x2="294" y2="70" class="st" stroke-width="1.4" marker-end="url(#arr-bfs)"/><circle cx="310" cy="70" r="15" class="jb"/><text x="310" y="75" class="on" font-size="13" text-anchor="middle" font-weight="600">B</text><text x="310" y="104" class="mu" font-size="11" text-anchor="middle">deadline 20</text><line x1="325" y1="70" x2="384" y2="70" class="st" stroke-width="1.4" marker-end="url(#arr-bfs)"/><circle cx="400" cy="70" r="15" class="jd"/><text x="400" y="75" class="on" font-size="13" text-anchor="middle" font-weight="600">D</text><text x="400" y="104" class="mu" font-size="11" text-anchor="middle">deadline 31</text><line x1="415" y1="70" x2="474" y2="70" class="st" stroke-width="1.4" marker-end="url(#arr-bfs)"/><circle cx="490" cy="70" r="15" class="je"/><text x="490" y="75" class="on" font-size="13" text-anchor="middle" font-weight="600">E</text><text x="490" y="104" class="mu" font-size="11" text-anchor="middle">deadline 40</text><rect x="70" y="150" width="120" height="38" class="bx" rx="5"/><text x="130" y="174" class="fg" font-size="13" text-anchor="middle" font-weight="600">CPU 0</text><rect x="250" y="150" width="120" height="38" class="bx" rx="5"/><text x="310" y="174" class="fg" font-size="13" text-anchor="middle" font-weight="600">CPU 1</text><line x1="130" y1="112" x2="130" y2="146" class="st" stroke-width="1.4" marker-end="url(#arr-bfs)"/><line x1="220" y1="112" x2="300" y2="146" class="st" stroke-width="1.4" marker-end="url(#arr-bfs)"/><text x="392" y="174" class="mu" font-size="12" text-anchor="start">earliest virtual deadline first</text><text x="20" y="222" class="fg" font-size="13" text-anchor="start" font-weight="600">deadline = now + (priority ratio × rr_interval)</text>
</svg>
