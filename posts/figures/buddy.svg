<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-label="Binary buddy allocator: 64KB splits into two 32KB, then 16KB, then 8KB blocks; the first 8KB block is chosen for a 7KB request">
<defs><marker id="arr-buddy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<rect x="220" y="16" width="397" height="34" class="bx" rx="3"/><text x="418.5" y="38" class="fg" font-size="13" text-anchor="middle" font-weight="600">64KB</text><rect x="220" y="70" width="197" height="34" class="bx" rx="3"/><text x="318.5" y="92" class="fg" font-size="13" text-anchor="middle" font-weight="600">32KB</text><line x1="318.5" y1="50" x2="318.5" y2="68" class="ax"/><rect x="420" y="70" width="197" height="34" class="bx" rx="3"/><text x="518.5" y="92" class="fg" font-size="13" text-anchor="middle" font-weight="600">32KB</text><line x1="518.5" y1="50" x2="518.5" y2="68" class="ax"/><rect x="220" y="124" width="97" height="34" class="bx" rx="3"/><text x="268.5" y="146" class="fg" font-size="13" text-anchor="middle" font-weight="600">16KB</text><line x1="268.5" y1="104" x2="268.5" y2="122" class="ax"/><rect x="320" y="124" width="97" height="34" class="bx" rx="3"/><text x="368.5" y="146" class="fg" font-size="13" text-anchor="middle" font-weight="600">16KB</text><line x1="368.5" y1="104" x2="368.5" y2="122" class="ax"/><rect x="220" y="178" width="47" height="34" class="jb" rx="3"/><text x="243.5" y="200" class="on" font-size="11" text-anchor="middle" font-weight="600">8KB</text><line x1="243.5" y1="158" x2="243.5" y2="176" class="ax"/><rect x="270" y="178" width="47" height="34" class="bx" rx="3"/><text x="293.5" y="200" class="fg" font-size="11" text-anchor="middle" font-weight="600">8KB</text><line x1="293.5" y1="158" x2="293.5" y2="176" class="ax"/><text x="20" y="38" class="fg" font-size="13" text-anchor="start" font-weight="600">request for 7KB</text><text x="20" y="196" class="fg" font-size="13" text-anchor="start" font-weight="600">This block gets chosen</text><line x1="190" y1="192" x2="214" y2="192" class="st" stroke-width="1.4" marker-end="url(#arr-buddy)"/><text x="20" y="250" class="mu" font-size="12" text-anchor="start">recursively coalesce 8 → 16 → 32 → 64</text>
</svg>
