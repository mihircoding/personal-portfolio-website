<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="A system call traps from user mode into the kernel's trap handler, then returns to user mode">
<defs><marker id="arr-lde-syscall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<rect x="10" y="10" width="620" height="90" class="mb" rx="6"/><rect x="10" y="140" width="620" height="90" class="bx" rx="6"/><text x="24" y="32" class="mu" font-size="12" text-anchor="start" font-weight="600">User mode (restricted)</text><text x="24" y="162" class="mu" font-size="12" text-anchor="start" font-weight="600">Kernel mode (full access)</text><line x1="10" y1="120" x2="630" y2="120" class="ax" stroke-dasharray="5 4"/><text x="316" y="114" class="mu" font-size="11" text-anchor="middle">hardware enforces this boundary</text><rect x="30" y="46" width="150" height="44" class="ja" rx="5"/><text x="105" y="65" class="on" font-size="13" text-anchor="middle" font-weight="600">Process runs</text><text x="105" y="81" class="on" font-size="11" text-anchor="middle">normal instructions</text><rect x="430" y="46" width="180" height="44" class="ja" rx="5"/><text x="520" y="65" class="on" font-size="13" text-anchor="middle" font-weight="600">Process continues</text><text x="520" y="81" class="on" font-size="11" text-anchor="middle">with the result</text><rect x="210" y="176" width="220" height="44" class="jd" rx="5"/><text x="320" y="195" class="on" font-size="13" text-anchor="middle" font-weight="600">Trap handler (OS)</text><text x="320" y="211" class="on" font-size="11" text-anchor="middle">create process, allocate memory, I/O</text><line x1="180" y1="80" x2="240" y2="172" class="st" stroke-width="1.4" marker-end="url(#arr-lde-syscall)"/><text x="200" y="146" class="fg" font-size="12" text-anchor="end" font-weight="600">system call → trap</text><line x1="410" y1="172" x2="470" y2="92" class="st" stroke-width="1.4" marker-end="url(#arr-lde-syscall)"/><text x="446" y="146" class="fg" font-size="12" text-anchor="start" font-weight="600">return-from-trap</text>
</svg>
