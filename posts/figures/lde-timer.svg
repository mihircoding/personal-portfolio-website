<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" role="img" aria-label="Timer interrupt and context switch from process A to process B">
<defs><marker id="arr-lde-timer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<rect x="10" y="10" width="620" height="70" class="mb" rx="6"/><text x="20" y="44" class="fg" font-size="12" text-anchor="start" font-weight="600">Program</text><text x="20" y="59" class="mu" font-size="11" text-anchor="start">user mode</text><rect x="10" y="88" width="620" height="70" class="bx" rx="6"/><text x="20" y="127" class="fg" font-size="12" text-anchor="start" font-weight="600">Hardware</text><rect x="10" y="166" width="620" height="70" class="mb" rx="6"/><text x="20" y="200" class="fg" font-size="12" text-anchor="start" font-weight="600">OS</text><text x="20" y="215" class="mu" font-size="11" text-anchor="start">kernel mode</text><rect x="100" y="177" width="96" height="48" class="jd" rx="5"/><text x="148" y="197" class="on" font-size="12" text-anchor="middle" font-weight="600">Boot</text><text x="148" y="213" class="on" font-size="11" text-anchor="middle">trap table, timer</text><rect x="206" y="21" width="84" height="48" class="ja" rx="5"/><text x="248" y="41" class="on" font-size="12" text-anchor="middle" font-weight="600">Process A</text><text x="248" y="57" class="on" font-size="11" text-anchor="middle">runs</text><rect x="300" y="99" width="110" height="48" class="jc" rx="5"/><text x="355" y="119" class="on" font-size="12" text-anchor="middle" font-weight="600">Timer interrupt</text><text x="355" y="135" class="on" font-size="11" text-anchor="middle">save A, to kernel</text><rect x="420" y="177" width="100" height="48" class="jd" rx="5"/><text x="470" y="197" class="on" font-size="12" text-anchor="middle" font-weight="600">Handle trap</text><text x="470" y="213" class="on" font-size="11" text-anchor="middle">switch(): A → B</text><rect x="530" y="99" width="100" height="48" class="jc" rx="5"/><text x="580" y="119" class="on" font-size="12" text-anchor="middle" font-weight="600">Return-from-trap</text><text x="580" y="135" class="on" font-size="11" text-anchor="middle">restore B</text><rect x="530" y="21" width="100" height="48" class="jb" rx="5"/><t