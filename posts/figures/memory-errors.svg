<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="Buffer overflow: data written past the allocated cells. Memory leak: heap fills with blocks never freed. Dangling pointer: pointer x still points to freed memory">
