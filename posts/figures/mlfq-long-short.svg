 x2="335" y2="155" class="ax"/><text x="335" y="169" class="mu" font-size="11" text-anchor="middle">100</text><line x1="477.5" y1="150" x2="477.5" y2="155" class="ax"/><text x="477.5" y="169" class="mu" font-size="11" text-anchor="middle">150</text><line x1="620" y1="150" x2="620" y2="155" class="ax"/><text x="620" y="169" class="mu" font-size="11" text-anchor="middle">200</text><text x="335" y="187" class="mu" font-size="11" text-anchor="middle">Time (ms)</text><text x="50" y="212" class="fg" font-size="13" text-anchor="start">New jobs start at the top. B is short, so it finishes before reaching the bottom queue.</text>
