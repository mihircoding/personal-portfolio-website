<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" role="img" aria-label="Two CPUs with private caches share memory over a bus; bus snooping keeps the caches coherent">
<defs><marker id="arr-multicore-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<rect x="60" y="14" width="200" height="40" class="ja" rx="5"/><text x="160" y="39" class="on" font-size="13" text-anchor="middle" font-weight="600">CPU 0</text><rect x="60" y="64" width="200" height="44" class="mb" rx="5"/><text x="160" y="84" class="fg" font-size="12" text-anchor="middle" font-weight="600">Cache</text><text x="160" y="100" class="mu" font-size="11" text-anchor="middle">writes D → D'</text><line x1="160" y1="108" x2="160" y2="150" class="ax" stroke-width="1.4"/><rect x="380" y="14" width="200" height="40" class="ja" rx="5"/><text x="480" y="39" class="on" font-size="13" text-anchor="middle" font-weight="600">CPU 1</text><rect x="380" y="64" width="200" height="44" class="mb" rx="5"/><text x="480" y="84" class="fg" font-size="12" text-anchor="middle" font-weight="600">Cache</text><text x="480" y="100" class="mu" font-size="11" text-anchor="middle">D (stale) → invalidated</text><line x1="480" y1="108" x2="480" y2="150" class="ax" stroke-width="1.4"/><rect x="20" y="150" width="600" height="20" class="ink" rx="4"/><text x="320" y="164" class="blk-t" font-size="12" text-anchor="middle" font-weight="600">Bus</text><line x1="320" y1="170" x2="320" y2="200" class="ax" stroke-width="1.4"/><rect x="210" y="200" width="220" height="44" class="bx" rx="5"/><text x="320" y="220" class="fg" font-size="13" text-anchor="middle" font-weight="600">Main memory</text><text x="320" y="236" class="mu" font-size="11" text-anchor="middle">D</text><line x1="270" y1="128" x2="370" y2="128" class="st" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-multicore-cache)"/><text x="320" y="122" class="mu" font-size="11" text-anchor="middle">snoop</text><text x="320" y="270" class="mu" font-size="12" text-anchor="middle">Each cache watches the bus. When CPU 0 writes D, CPU 1's cache sees it and drops (or updates) its copy.</text>
</svg>
