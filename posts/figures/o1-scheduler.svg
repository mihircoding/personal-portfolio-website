<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" role="img" aria-label="O(1) scheduler: higher priorities get longer timeslices; sleeping a lot boosts priority">
<defs><marker id="arr-o1-scheduler" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<text x="150" y="22" class="mu" font-size="12" text-anchor="end" font-weight="600">Priority</text><text x="170" y="22" class="mu" font-size="12" text-anchor="start" font-weight="600">Timeslice</text><text x="150" y="57" class="fg" font-size="12" text-anchor="end" font-weight="600">highest</text><rect x="170" y="40" width="250" height="24" class="ja" rx="3" opacity="1"/><text x="150" y="91" class="mu" font-size="14" text-anchor="end">·</text><rect x="170" y="74" width="195" height="24" class="ja" rx="3" opacity="0.86"/><text x="150" y="125" class="mu" font-size="14" text-anchor="end">·</text><rect x="170" y="108" width="145" height="24" class="ja" rx="3" opacity="0.72"/><text x="150" y="159" class="mu" font-size="14" text-anchor="end">·</text><rect x="170" y="142" width="100" height="24" class="ja" rx="3" opacity="0.58"/><text x="150" y="193" class="fg" font-size="12" text-anchor="end" font-weight="600">lowest</text><rect x="170" y="176" width="60" height="24" class="ja" rx="3" opacity="0.43999999999999995"/><line x1="460" y1="200" x2="460" y2="42" class="st" stroke-width="1.6" marker-end="url(#arr-o1-scheduler)"/><text x="472" y="54" class="fg" font-size="12" text-anchor="start" font-weight="600">more time sleeping</text><text x="472" y="70" class="mu" font-size="12" text-anchor="start">→ more interactive</text><text x="472" y="86" class="mu" font-size="12" text-anchor="start">→ boost priority</text><line x1="448" y1="42" x2="448" y2="200" class="ax" stroke-width="1.6" marker-end="url(#arr-o1-scheduler)"/><text x="472" y="164" class="fg" font-size="12" text-anchor="start" font-weight="600">less time sleeping</text><text x="472" y="180" class="mu" font-size="12" text-anchor="start">→ less interaction</text><text x="472" y="196" class="mu" font-size="12" text-anchor="start">→ less priority</text>
</svg>
