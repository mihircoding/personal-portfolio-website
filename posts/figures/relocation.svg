<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 379" role="img" aria-label="A 16KB address space (code, heap, free, stack) relocated into 64KB of physical memory between 32KB and 48KB; the OS sits at 0KB to 16KB">
<defs><marker id="arr-relocation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<text x="160" y="18" class="mu" font-size="12" text-anchor="middle" font-weight="600">Address space (virtual)</text><text x="490" y="18" class="mu" font-size="12" text-anchor="middle" font-weight="600">Physical memory</text><rect x="70" y="32" width="180" height="39" class="jc" rx="3"/><text x="160" y="56" class="on" font-size="13" text-anchor="middle" font-weight="600">Code</text><text x="60" y="36" class="mu" font-size="11" text-anchor="end">0KB</text><rect x="70" y="74" width="180" height="39" class="ja" rx="3"/><text x="160" y="98" class="on" font-size="13" text-anchor="middle" font-weight="600">Heap</text><text x="60" y="78" class="mu" font-size="11" text-anchor="end">2KB</text><rect x="70" y="116" width="180" height="203" class="mb" rx="3"/><text x="160" y="222" class="mu" font-size="13" text-anchor="middle" font-weight="600">(free)</text><text x="60" y="120" class="mu" font-size="11" text-anchor="end">4KB</text><rect x="70" y="322" width="180" height="47" class="jb" rx="3"/><text x="160" y="350" class="on" font-size="13" text-anchor="middle" font-weight="600">Stack</text><text x="60" y="326" class="mu" font-size="11" text-anchor="end">14KB</text><text x="60" y="373" class="mu" font-size="11" text-anchor="end">16KB</text><rect x="400" y="32" width="180" height="57" class="jd" rx="3"/><text x="490" y="65" class="on" font-size="13" text-anchor="middle" font-weight="600">OS</text><text x="390" y="36" class="mu" font-size="11" text-anchor="end">0KB</text><rect x="400" y="92" width="180" height="57" class="mb" rx="3"/><text x="490" y="125" class="mu" font-size="13" text-anchor="middle" font-weight="600">not in use</text><text x="390" y="96" class="mu" font-size="11" text-anchor="end">16KB</text><rect x="400" y="152" width="180" height="27" class="jc" rx="3"/><text x="490" y="170" class="on" font-size="13" text-anchor="middle" font-weight="600">Code</text><text x="390" y="156" class="mu" font-size="11" text-anchor="end">32KB</text><rect x="400" y="182" width="180" height="27" class="ja" rx="3"/><text x="490" y="200" class="on" font-size="13" text-anchor="middle" font-weight="600">Heap</text><rect x="400" y="212" width="180" height="77" class="mb" rx="3"/><text x="490" y="255" class="mu" font-size="13" text-anchor="middle" font-weight="600">allocated, not in use</text><rect x="400" y="292" width="180" height="27" class="jb" rx="3"/><text x="490" y="310" class="on" font-size="13" text-anchor="middle" font-weight="600">Stack</text><rect x="400" y="322" width="180" height="47" class="mb" rx="3"/><text x="490" y="350" class="mu" font-size="13" text-anchor="middle" font-weight="600">not in use</text><text x="390" y="326" class="mu" font-size="11" text-anchor="end">48KB</text><text x="390" y="373" class="mu" font-size="11" text-anchor="end">64KB</text><line x1="160" y1="126" x2="160" y2="168" class="st" stroke-width="1.4" marker-end="url(#arr-relocation)"/><line x1="160" y1="312" x2="160" y2="270" class="st" stroke-width="1.4" marker-end="url(#arr-relocation)"/><text x="80" y="337" class="on" font-size="11" text-anchor="start">3000</text><line x1="256" y1="219" x2="394" y2="235.5" class="st" stroke-width="1.4" marker-end="url(#arr-relocation)"/>
