<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 156" role="img" aria-label="SJF with late arrivals: A runs 0 to 100 even though B and C arrive at 10">
<defs><marker id="arr-sjf-late" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<rect x="70" y="34" width="550" height="34" class="mb" rx="3"/><text x="60" y="55.5" class="mu" font-size="12" text-anchor="end" font-weight="500">CPU</text><rect x="70.5" y="34.5" width="457.3333333333333" height="33" class="ja" rx="2"/><text x="299.16666666666663" y="55.5" class="on" font-size="13" text-anchor="middle" font-weight="600">A</text><rect x="528.8333333333333" y="34.5" width="44.83333333333333" height="33" class="jb" rx="2"/><text x="551.2499999999999" y="55.5" class="on" font-size="13" text-anchor="middle" font-weight="600">B</text><rect x="574.6666666666666" y="34.5" width="44.83333333333333" height="33" class="jc" rx="2"/><text x="597.0833333333333" y="55.5" class="on" font-size="13" text-anchor="middle" font-weight="600">C</text><line x1="115.83333333333333" y1="8" x2="115.83333333333333" y2="32" class="st" stroke-width="1.4" marker-end="url(#arr-sjf-late)"/><text x="121.83333333333333" y="16" class="mu" font-size="11" text-anchor="start">B, C arrive</text><line x1="70" y1="80" x2="620" y2="80" class="ax"/><line x1="70" y1="80" x2="70" y2="85" class="ax"/><text x="70" y="99" class="mu" font-size="11" text-anchor="middle">0</text><line x1="161.66666666666666" y1="80" x2="161.66666666666666" y2="85" class="ax"/><text x="161.66666666666666" y="99" class="mu" font-size="11" text-anchor="middle">20</text><line x1="253.33333333333331" y1="80" x2="253.33333333333331" y2="85" class="ax"/><text x="253.33333333333331" y="99" class="mu" font-size="11" text-anchor="middle">40</text><line x1="345" y1="80" x2="345" y2="85" class="ax"/><text x="345" y="99" class="mu" font-size="11" text-anchor="middle">60</text><line x1="436.66666666666663" y1="80" x2="436.66666666666663" y2="85" class="ax"/><text x="436.66666666666663" y="99" class="mu" font-size="11" text-anchor="middle">80</text><line x1="528.3333333333333" y1="80" x2="528.3333333333333" y2="85" class="ax"/><text x="528.3333333333333" y="99" class="mu" font-size="11" text-anchor="middle">100</text><line x1="620" y1="80" x2="620" y2="85" class="ax"/><text x="620" y="99" class="mu" font-size="11" text-anchor="middle">120</text><text x="345" y="117" class="mu" font-size="11" text-anchor="middle">Time (ms)</text><text x="70" y="142" class="fg" font-size="13" text-anchor="start">Average turnaround = (100 + (110 − 10) + (120 − 10)) / 3 ≈ 103.3</text>
