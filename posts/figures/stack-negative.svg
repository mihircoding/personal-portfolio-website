<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-label="The stack segment sits from 26KB to 28KB with base 28KB and grows backwards; virtual address 15KB has offset 3KB, 3 minus 4 is −1KB, and −1KB plus 28KB is 27KB">
<defs><marker id="arr-stack-negative" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<text x="330" y="24" class="mu" font-size="12" text-anchor="middle" font-weight="600">stack segment</text><rect x="260" y="40" width="140" height="120" class="jb" rx="3"/><line x1="260" y1="100" x2="400" y2="100" class="st" stroke-dasharray="4 3"/><text x="250" y="44" class="mu" font-size="11" text-anchor="end">26KB</text><text x="250" y="104" class="mu" font-size="11" text-anchor="end">27KB</text><text x="250" y="164" class="mu" font-size="11" text-anchor="end">28KB</text><text x="330" y="184" class="mu" font-size="12" text-anchor="middle">base = 28KB</text><text x="20" y="94" class="fg" font-size="13" text-anchor="start" font-weight="600">access 15KB</text><text x="20" y="112" class="mu" font-size="12" text-anchor="start">3KB offset</text><line x1="112" y1="100" x2="214" y2="100" class="st" stroke-width="1.4" marker-end="url(#arr-stack-negative)"/><line x1="420" y1="156" x2="420" y2="44" class="st" stroke-width="1.4" marker-end="url(#arr-stack-negative)"/><text x="432" y="64" class="mu" font-size="12" text-anchor="start">stack grows backwards</text><text x="432" y="118" class="fg" font-size="13" text-anchor="start" font-weight="600">3 − 4 = −1KB</text><text x="432" y="140" class="fg" font-size="13" text-anchor="start" font-weight="600">−1KB + 28KB = 27KB</text>
</svg>
